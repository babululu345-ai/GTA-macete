    <title>GTA MACETE PREMIUM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 20px; max-width: 480px; margin: 0 auto; }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(135deg, #000 0%, #0d1117 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .splash-text { text-align: center; }
        .splash-text h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #33ccff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #00d4ff;
            border-radius: 50%;
            width: 40px; height: 40px; margin: 20px auto 0;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        /* Banner Principal */
        .banner {
            background: linear-gradient(135deg, #33ccff 0%, #ff00ff 100%);
            padding: 35px 20px; border-radius: 40px; text-align: center; margin-bottom: 35px;
        }
        .banner h1 {
            font-size: 42px; font-weight: 900; color: #fff; line-height: 1.1; margin-bottom: 20px;
        }
        .banner h1 span { display: inline-block; margin: 0 8px; }
        .dates { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .date-row { display: flex; gap: 10px; }
        .date-box {
            background: rgba(0,0,0,0.25); padding: 8px 18px; border-radius: 20px;
            font-size: 14px; font-weight: 600;
        }

        /* Rótulos */
        .label {
            font-size: 18px; color: #33ccff; font-weight: bold;
            margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Botões - IGUAL À FOTO */
        .grid-game { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 10px; }
        .grid-platform { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .grid-platform .row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }

        .btn {
            padding: 18px 10px; border-radius: 16px; border: none;
            font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            background: #1a1f2e; color: #8b949e; transition: all 0.3s ease;
        }
        .btn.active {
            background: linear-gradient(90deg, #33ccff, #ff00ff);
            color: #fff; box-shadow: 0 0 15px rgba(51,204,255,0.4);
        }

        /* Pesquisa */
        .search {
            width: 100%; padding: 18px 20px; background: #1a1a1f; border: none;
            border-radius: 16px; color: #fff; margin: 25px 0; font-size: 16px; outline: none;
        }
        .search::placeholder { color: #666; }

        /* Cartões */
        .card {
            background: #121217; padding: 25px; border-radius: 20px; margin-bottom: 15px;
            border-left: 4px solid #33ccff;
        }
        .c-name { font-weight: bold; font-size: 22px; margin-bottom: 15px; display: block; }
        .c-code {
            background: #000; padding: 20px; border-radius: 12px;
            color: #33ccff; font-family: monospace; font-size: 20px;
            line-height: 1.8; display: block;
        }
    </style>
</head>

    let currentGame = 'v';
    let currentMode = 'PS4 / PS5';

    function renderGames() {
        let html = '';
        let games = [{id:'v', name:'GTA V'}, {id:'iv', name:'GTA IV'}, {id:'sa', name:'GTA SA'}];
        games.forEach(g => {
            html += `<button class="btn ${g.id === currentGame ? 'active' : ''}" onclick="setGame('${g.id}')">${g.name}</button>`;
        });
        document.getElementById('games').innerHTML = html;
        renderPlatforms();
    }

    function setGame(id) {
        currentGame = id;
        currentMode = db[currentGame].m[0];
        renderGames();
    }

    function renderPlatforms() {
        let row1 = '';
        let row2 = '';
        db[currentGame].row1.forEach(p => {
            row1 += `<button class="btn ${p === currentMode ? 'active' : ''}" onclick="setMode('${p}')">${p}</button>`;
        });
        db[currentGame].row2.forEach(p => {
            row2 += `<button class="btn ${p === currentMode ? 'active' : ''}" onclick="setMode('${p}')">${p}</button>`;
        });
        document.getElementById('platform-row1').innerHTML = row1;
        document.getElementById('platform-row2').innerHTML = row2;
        renderList();
    }

    function setMode(m) {
        currentMode = m;
        renderPlatforms();
    }

    function renderList(filter = '') {
        let html = '';
        let items = db[currentGame][currentMode];
        items.forEach(item => {
            if(!filter || item.n.toLowerCase().includes(filter.toLowerCase())) {
                html += `
                <div class="card">
                    <span class="c-name">${item.n}</span>
                    <span class="c-code">${item.c}</span>
                </div>
                `;
            }
        });
        document.getElementById('list').innerHTML = html;
    }

    function search(text) { renderList(text); }

    renderGames();
</script>
